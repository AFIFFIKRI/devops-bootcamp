<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Bootcamp 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0f172a;
    color: #e2e8f0;
  }

  .card {
    background: #1e293b;
    border-radius: 20px;
    padding: 2.5rem 3rem;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
  }

  .badge {
    display: inline-block;
    padding: 0.5rem 1.25rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    animation: pulse 2.5s ease-in-out infinite;
  }

  h1 { margin: 1.25rem 0 0.25rem; font-size: 2rem; }
  .role { color: #94a3b8; font-size: 1.1rem; }
  .cohort { margin-top: 1rem; color: #cbd5e1; font-size: 0.95rem; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">DevOps Bootcamp 2026</span>
    <h1>Afiffikri Auspan</h1>
    <p class="role">DevOps Engineer</p>
    <p class="cohort">Cohort 4</p>
  </div>
</body>
</html>
